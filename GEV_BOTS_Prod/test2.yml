---
- name: Test script
  hosts: localhost
  gather_facts: true
  tasks:
    - name: Epoch + 1 hour
      set_fact:
        now_plus_1h: "{{ (ansible_date_time.epoch | int) + 3600 }}"

    - name: Convert to IST datetime string (YYYY-MM-DD HH:MM:SS)
      command: bash -lc 'TZ=Asia/Kolkata date -d "@{{ now_plus_1h }}" "+%Y-%m-%d %H:%M:%S"'
      register: ist_dt

    - debug:
        var: ist_dt.stdout
     
      
     
