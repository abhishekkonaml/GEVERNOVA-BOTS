---
 - name: Test  script
   hosts: localhost
   tasks:
     - name: Epoch + 1 hour
       set_fact:
         now_plus_1h: "{{ (ansible_date_time.epoch | int) + 3600 }}"

     - name: IST datetime string
       set_fact:
         now_plus_1h_ist: >-
            {{ now_plus_1h | to_datetime('%s', timezone='Asia/Kolkata')
                    | strftime('%Y-%m-%d %H:%M:%S') }}

     - debug: var=now_plus_1h_ist
     
      
     
