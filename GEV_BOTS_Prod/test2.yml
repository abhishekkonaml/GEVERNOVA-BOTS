---
 - name: Child Tagging script
   hosts: localhost
   tasks:
     - set_fact:
        query: "resolved_atONYesterday@javascript:gs.beginningOfYesterday()@javascript:gs.endOfYesterday()^assignment_group=609fb9273b426690e2d5cbc964e45a7a"
        #query: "assignment_group=306e23c52b1cee903439fb5dce91bf1f^state=2^parent_incidentISNOTEMPTY^sys_created_onONToday@javascript:gs.beginningOfToday()@javascript:gs.endOfToday()"
     - name: fetch  closed tickets
       action: Fetch_tickets_for_Child_tagging query1="{{ query }}"
       register: result
     - debug: var=result.response
     - set_fact:
        numbers: "{{ result.response }}"
     - debug: var=numbers
     - block:
        - debug:
            msg: "trigger email"
        
       
       
       when: "'More than 18 tickets got closed' not in numbers"
     
      
     
