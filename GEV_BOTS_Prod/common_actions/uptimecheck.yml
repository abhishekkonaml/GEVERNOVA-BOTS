---
  - name: check uptime
    action: InterfaceStatusExecution hostname='{{ incident_hostname }}' command='show version | i uptime' incidentno='{{ incident_no }}' notesupdate='yes' 
    register: version_status_register
    ignore_errors: true
  - debug: var=version_status_register.Output
  - set_fact:
     version_status_register: "{{ version_status_register.Output }}"
  - block:
    - debug:
        msg: "Unable to connect to host end the play"
    - action: update_notes incident='{{ incident_no }}' work_notes='[code]<h3>Summary:\n </h3> 1. Ping is successful <br> 2. Unable to connect to device <br>[/code]'
      register: update_notes
    - action: update_notes incident='{{ incident_no }}' work_notes='[code]<h3>Unable to troubleshoot, hence reassigned </h3>[/code]'
      register: update_notes
    - action: reassignment_ticket incident='{{ incident_no }}'
      register: reassignment_ticket_register
    - debug: var=reassignment_ticket_register.stdout
   
    - meta: end_play
    when: "('Hostname not known' in version_status_register) or ('Authentication failed' in version_status_register) or ('Unable to connect' in version_status_register) or ('invalid input' in version_status_register) or version_status_register is not defined"

