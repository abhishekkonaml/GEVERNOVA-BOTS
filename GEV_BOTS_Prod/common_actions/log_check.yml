- set_fact:
    command1: "sh log | in {{ keyword_to_validate }}"
- debug: var=command1
- name: Log check
  action: InterfaceStatusExecution hostname='{{ incident_hostname }}' command='{{ command1 }}' incidentno='{{ incident_no }}' notesupdate='no'
  register: log_register
- set_fact: 
    log_results: "{{ log_register.Output }}"
- debug: var=log_results
- block:
    - set_fact:
        InputNotes: |-
                 [code] 
                        <h3> LOG RESULTS:  NO LOGS FOUND </h3> [/code]
    - action: update_notes incident='{{ incident_no }}' work_notes='{{ InputNotes }}'
      register: update_notes
    - debug: var=update_notes
      
  when: "'No Logs found' in log_results"
- block:
   - shell: echo "{{ log_results }}" > log.txt
   - shell: cat log.txt | tail -10
     register: last_ten_log_register
   - debug: var=last_ten_log_register

   - set_fact:
      InputNotes: |-
                 [code] 
                        <h3> LOG RESULTS: </h3> [/code]
                        {{ last_ten_log_register.stdout }} 
   - action: update_notes incident='{{ incident_no }}' work_notes='{{ InputNotes }}'
     register: update_notes
   
   - shell: grep -v '^$' log.txt | tail -1
     register: last_log_register
   - debug: var=last_log_register
   - set_fact:
        last_log_results: "{{ last_log_register.stdout }}"
   - debug: var=last_log_results
   - name: Show Clock
     action: InterfaceStatusExecution hostname='{{ incident_hostname }}' command='sh clock' incidentno='{{ incident_no }}' notesupdate='yes'
     register: clock_register
   - set_fact: 
        clock_results: "{{ clock_register.Output }}"
   - debug: var=clock_results
   - name: Validation
     action: log_checker log_results='{{ last_log_results }}' clock_results='{{clock_results}}'
     register: uptime_register
   - set_fact:
          uptime_result: "{{ uptime_register.output }}"
   - debug: var=uptime_result

   - block:
     - set_fact:
        InputNotes: |-
                   [code]<h3> The {{ incident_interface }} is not flapping in the last 30 minutes
                    </h3> [/code]
     - action: update_notes incident='{{ incident_no }}' work_notes='{{ InputNotes }}'
       register: update_notes
     when: "'Success' in uptime_result" 

   - block:
     - include_tasks: bots/ConnectionAndInterfaceDown/failure_commands_except_ap.yml 
     - set_fact:
        InputNotes: |-
                   [code]<h3> Summary: </h3>
                    1. Ping is successful  <br>
                     2. Interface status is up <br>
                     3. The {{ incident_interface }} is flapping in the last 30 minutes hence reassigned.
                     <br>[/code]
     - action: update_notes incident='{{ incident_no }}' work_notes='{{ InputNotes }}'
       register: update_notes
     - action: worknotesupdate work_notes='{{ InputNotes }}'
       register: worknotesupdate
     - action: reassignment_ticket incident='{{ incident_no }}' group='{{ assignment_group }}'
       register: reassignment_ticket
     - name: save_output
       set_fact:
        aa_start_save: ''
        botname: '{{ bot_name }}'
        retcode: 'MBRETCD002'
        retdesc: 'The {{ incident_interface }} is flapping in the last 30 minutes hence reassigned.'
        assignment_group: "{{assigngrp|default('')}}"
        assign_to: "{{assignto|default('')}}"
        zz_end_save: ''
     - action: reassignment_ticket incident='{{ incident_no }}' group='{{ assignment_group }}'   
     - meta: end_play
     when: "'Success' not in uptime_result" 
         
  when: "'No Logs found' not in log_results"
