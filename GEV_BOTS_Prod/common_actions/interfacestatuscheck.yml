- set_fact:
     command1: "sh int {{ incident_interface }}"
     command2: "sh cdp nei {{ incident_interface }} detail"
- name: Interface status check
  action: InterfaceStatusExecution hostname='{{ incident_hostname }}' command='{{ command1 }}' incidentno='{{ incident_no }}' notesupdate='yes'
  register: interface_status_register
  ignore_errors: true
  loop: "{{ range(1, 3) | list }}"
  loop_control:
    label: "Interface check attempt {{ item }}"
    pause: 600
  failed_when: false

- set_fact:
    Interfaceresult: "{{ interface_status_register.results[-1].Output | default('') }}"

- name: Interface Neighbor status
  action: InterfaceStatusExecution hostname='{{ incident_hostname }}' command='{{ command2 }}' incidentno='{{ incident_no }}' notesupdate='yes'
  register: interface_nei_register
- set_fact:
       interface_nei_result: "{{ interface_nei_register.Output }}"
- debug: var=interface_nei_result
- block:
  - set_fact:
       bot_notes: |
                 [code] 
                  <h3>Summary: </h3> 
                  1. Ping is successful. <br>
                  2.Interface is down after three attempts hence reassigned. <br>
                  [/code]
  - debug:    
      msg: "Interface is down hence reassigned"
  - action: update_notes incident='{{ incident_no }}' work_notes='[code]<h3> Interface is down hence reassigned. </h3>[/code]'
    register: update_notes
  - debug: var=update_notes
  - action: update_notes incident='{{ incident_no }}' work_notes='{{ bot_notes }}'
    register: update_notes
  - debug: var=update_notes
  - name: Add work notes - 2
    action: worknotesupdate work_notes='{{ bot_notes }}'
    register: worknotesupdate
  
  - debug: var=worknotesupdate
  - action: reassignment_ticket incident='{{ incident_no }}' group='{{ assignment_group }}'
    register: reassignment_ticket
  - name: save_output
    set_fact:
        aa_start_save: ''
        botname: '{{bot_name}}'
        retcode: 'MBRETCD002'
        retdesc: 'Interface is down after three attempts hence reassigned'
        assignment_group: "{{assigngrp|default('')}}"
        assign_to: "{{assignto|default('')}}"
        zz_end_save: ''
  - action: reassignment_ticket incident='{{ incident_no }}' group='{{ assignment_group }}'
  - meta: end_play 
  when: "('is up' not in Interfaceresult)"

