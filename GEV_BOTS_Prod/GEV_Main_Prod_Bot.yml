---
 - name: GEV Bots
   hosts: localhost
   vars:
      incident_no: "{{ ticketNo }}"
      #incident_no: "GEVINC123"
      #bot_name: "ML_Test_SnowIntegration"
      
   tasks:
   # Fetching Incident Details
   - name: Bot Execution started
     action: Incident_details_extraction incident_no='{{ incident_no }}'
     register: fetched_details
   - debug: var=fetched_details
   - block:
     # Triggering the Bot
     - block:
       #Assigning to Bot group and id
       
       - set_fact:
          incident_hostname: "{{ fetched_details.hostname }}"
          incident_interface: "{{ fetched_details.interface }}"
          botname: "{{ fetched_details.botname }}"
          ap_name: "{{ fetched_details.ap_name }}"
          update_description: "{{ fetched_details.updated_desc }}"
       - debug: var=incident_hostname
       - debug: var=incident_interface
       - debug: var=botname
       - debug: var=ap_name
       - debug: var=update_description
       - action: AssignedtoBot incident='{{ incident_no }}' jobid='{{ tower_job_id }}' update_desc='{{ update_description }}'
         register: assigned_status_register
       - debug: var=assigned_status_register
       - debug:
           msg: "calling Status Flap role"
       - name: Call Status Flap role 
         include_tasks: bots/StatusFlap/statusflap.yml
       when: "'StatusFlap' in fetched_details.botname"

     - block:
       - set_fact:
          incident_hostname: "{{ fetched_details.hostname }}"
          botname: "{{ fetched_details.botname }}"
       - action: AssignedtoBot incident='{{ incident_no }}' 
         register: assigned_status_register
       - debug: var=assigned_status_register  
       - debug: var=incident_hostname
       - debug: var=botname
       
       - debug:
           msg: "calling temperature sensor role"
       - name: call temperature sensor role
         include_tasks: bots/Temperature_Sensor/main.yml
       
       when: "'Temperature Sensor' in fetched_details.botname"
     - block:
       
       - set_fact:
          incident_hostname: "{{ fetched_details.hostname }}"
          incident_interface: "{{ fetched_details.interface }}"
          botname: "{{ fetched_details.botname }}"
          update_description: "{{ fetched_details.updated_desc }}"
          
       - debug: var=incident_hostname
       - debug: var=incident_interface
       - debug: var=botname
       - debug: var=update_description
       - action: AssignedtoBot incident='{{ incident_no }}' jobid='{{ tower_job_id }}' update_desc='{{ update_description }}'
         register: assigned_status_register
       - debug: var=assigned_status_register
       - set_fact:
            bot_name: "StatusAlert"
       - debug:
           msg: "Calling Status Alert role"
       - name: Call Status Alert role 
         include_tasks: bots/ConnectionAndInterfaceDown/connectionandinterfacedown.yml
       when: "'StatusAlert' in fetched_details.botname"
     - block:
       - set_fact:
          incident_hostname: "{{ fetched_details.hostname }}"
          botname: "{{ fetched_details.botname }}"
          update_description: "{{ fetched_details.updated_desc }}"
       - action: AssignedtoBot incident='{{ incident_no }}' jobid='{{ tower_job_id }}' update_desc='{{ update_description }}'
         register: assigned_status_register
       
       - debug: var=assigned_status_register  
       - debug: var=incident_hostname
       - debug: var=botname
       - debug: var=update_description
       
       - debug:
           msg: "calling node down role"
       - name: call node down role
         include_tasks: bots/NodedownAndNodestopped/main.yml
       
       when: "'Node down' in fetched_details.botname"
     when: "'success' in fetched_details.status"
   - block:
     - debug: msg='No Records found with the given Incident number'
     - meta: end_play
     when: "'failed' in fetched_details.status"
   - block:
     - debug: msg='Parsing Error'
     - meta: end_play
     when: "'error' in fetched_details.status"

   
   
