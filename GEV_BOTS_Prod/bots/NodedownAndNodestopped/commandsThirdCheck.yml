- name: execute commands
  action: CommandExecution hostname='{{ incident_hostname }}' command='{{ item }}' incidentno='{{ incident_no }}' notesupdate='yes' 
  register: command_status_register
  ignore_errors: true
  loop: "{{ commands }}"

- debug: var=command_status_register

- name: check uptime
  action: CommandExecution hostname='{{ incident_hostname }}' command='show version | i uptime' incidentno='{{ incident_no }}' notesupdate='yes' 
  register: version_status_register
  ignore_errors: true
- debug: var=version_status_register.Output
- set_fact:
    version_status_register: "{{ version_status_register.Output }}"

- name: Validate device uptime
  include_tasks: bots/NodedownAndNodestopped/UptimeCheck.yml
  register: output
  ignore_errors: true
- debug: var=output


  