---
- set_fact:
    commands: ['sh ip in brief', 'sh ip pro summ', 'show proc cpu | ex 0.00']

- name: check connectivity
  action: CommandExecution hostname='{{ incident_hostname }}' command='show clock' incidentno='{{ incident_no }}' notesupdate='yes' 
  register: clock_status_register
  ignore_errors: true
- debug: var=clock_status_register
  
- block:
    - debug:
        msg: "Unable to connect to host end the play"
    - action: update_notes incident='{{ incident_no }}' work_notes='[code]<h3>Summary:\n </h3> 1. Ping is successful <br> 2. Unable to connect to device <br>[/code]'
      register: update_notes
    - action: update_notes incident='{{ incident_no }}' work_notes='[code]<h3>Unable to troubleshoot, hence reassigned </h3>[/code]'
      register: update_notes
    #- action: worknotesupdate work_notes='[code]<h3>Summary:\n </h3> 1. Ping is successful <br> 2. Unable to connect to device <br>[/code]'
    #  register: worknotesupdate
    # name: save_output
    # set_fact:
    #   aa_start_save: ''
    #   botname: '{{bot_name}}'
    #   retcode: 'MBRETCD002'
    #   retdesc: 'Test Failure'
    #   assignment_group: "{{assigngrp|default('')}}"
    #   assign_to: "{{assignto|default('')}}"
    #   zz_end_save: ''
    - action: reassignment_ticket incident='{{ incident_no }}' group='{{ assignment_group }}'
 
    - debug: var=reassignment_ticket_register
   
    - meta: end_play
  when: "('Hostname not known' in clock_status_register.Output) or ('Authentication failed' in clock_status_register.Output) or ('Unable to connect' in clock_status_register.Output) or ('invalid input' in clock_status_register.Output)"

