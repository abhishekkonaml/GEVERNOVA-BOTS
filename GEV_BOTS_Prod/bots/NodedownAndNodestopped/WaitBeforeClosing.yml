---
  - name: fetch fourth and fifth letters of the device
    set_fact:  
         DevicefourthandfifthLetter: "{{ incident_hostname[3:5] | upper }}"
   
  - name: set frequency and delay_time for access switch and wlc
    set_fact:
        delay: 1800
        interval: 60
    when: "('WC' == DevicefourthandfifthLetter) or ('SA' == DevicefourthandfifthLetter)"
  - name: set frequency and delay_time
    set_fact:
        delay: 900
        interval: 60
    when: "('WC' != DevicefourthandfifthLetter) or ('SA' != DevicefourthandfifthLetter)"
  - set_fact:
      Threshold_time: "{{(delay | int) // (interval | int)}}"
  - debug: var=Threshold_time

  - name: Update notes saying ticket is under observation
    action: update_notes incident='{{ incident_no }}'  work_notes='[code]<h3>Device is reachable, Ticket will be monitored by the bot for next 30 minutes. </h3>[/code]'
    register: update_notes
  
  - name: Sleep for  15/30 minutes and continue with play
    ansible.builtin.wait_for:
     timeout: "{{ delay }}"
  - name: check uptime
    action: CommandExecution hostname='{{ incident_hostname }}' command='show version | i uptime' incidentno='{{ incident_no }}' notesupdate='yes' 
    register: version_status_register
    ignore_errors: true
  - debug: var=version_status_register.Output
  - set_fact:
      version_status_register: "{{ version_status_register.Output }}"
  - block:
        - name: Fetch Uptime Data When Uptime Is Exists In Uptime Data
          set_fact:
           ReloadUptimeResult: "{{ (version_status_register | regex_search('uptime is [0-9]{,4}\\s\\w+')).lower() }}"
          when: "(version_status_register is defined) and ('uptime is' in version_status_register)"
          
        - name: Fetch Uptime Data When Processor Is Exists In Uptime Data
          set_fact:
           ReloadUptimeResult: "{{ (version_status_register | regex_search('processor is [0-9]{,4}\\s\\w+')).lower() }}"
          when: "(version_status_register is defined) and ('processor is' in version_status_register)"
          
        - name: Uptime Message
          set_fact:
           UptimeNotesData: "{{ item }}"
          with_items: "{{ version_status_register.split('\n') }}"
          when: "'uptime is' in item"
          
        - name: Processor Message
          set_fact:
           UptimeNotesData: "{{ item }}"
          with_items: "{{ version_status_register.split('\n') }}"
          when: "'processor is' in item"
          
        - debug: var=ReloadUptimeResult
        - name: Fetch Hours
          set_fact:
            UpTimeNumericValue: "{{ ReloadUptimeResult.split()[2] }}"
              #when: "(('ROM by reload' in version_status_register) or ('ROM by bus' in version_status_register) or ('ROM by power' in version_status_register) or ('ROM by Power' in version_status_register))"
              
        - debug: var=UpTimeNumericValue
        - block:
               - name: Ping Counter Value when Uptime is < 30
                 set_fact:
                   PingCounterValue: 6
               - debug:
                   msg: "reassign ticket"
               - action: update_notes incident='{{ incident_no }}'  work_notes='[code]<h3>Summary:\n </h3>1. Ping is successful <br> 2. Device logs are attached <br> 3. The device uptime is not satisfactory, even after monitoring. <br>[/code]'
                 register: update_notes
               - action: update_notes incident='{{ incident_no }}' work_notes='[code]<h3>Unable to troubleshoot, hence reassigned </h3>[/code]'
                 register: update_notes
            
               - action: reassignment_ticket incident='{{ incident_no }}' group='{{ assignment_group }}'
                 register: reassignment_ticket_register
               - debug: var=reassignment_ticket_register
               - meta: end_play
          when: UpTimeNumericValue | int < Threshold_time | int
        - block:
               - name: Ping Counter Value when Uptime is >= 30
                 set_fact:
                   PingCounterValue: 3
               - debug:
                   msg: "close ticket"
               - action: update_notes incident='{{ incident_no }}' work_notes='[code]<h3>Summary:\n </h3>1. Ping is successful <br> 2. Device logs are attached <br> 3. Device is up <br> 4. Device has passed all checks <br>[/code]'
                 register: update_notes
               - action: update_notes incident='{{ incident_no }}' work_notes='[code]<h3>Closing the incident </h3>[/code]'
                 register: update_notes
              
               - action: closeincident incident='{{ incident_no }}'
                 register: close_ticket
               - debug: var=close_ticket
            
               - meta: end_play
          when: UpTimeNumericValue | int >= Threshold_time | int

    when: version_status_register is defined


  
