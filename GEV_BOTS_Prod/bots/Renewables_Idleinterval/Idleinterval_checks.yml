- name: fetch uptime 
  action: BGPPeersUptimeLogic output='{{BGPpeerOutput}}' 
  register: uptime_output
- debug: var=uptime_output

#fetch create date time

- name: check if its eligible to close
  action: Check_24hours_timestamp created_timestamp='{{ created_time }}'
  register: hourscheck_output
- debug: var=hourscheck_output

- name: Decide next action based on uptime and hours checks
  set_fact:
    uptime_result: "{{ uptime_output.result | default('') }}"
    hour_output: "{{ hourscheck_output.output | default('') | string }}"
    hour_greater: "{{ 'greater than 23' in hour_output }}"
    hour_lesser:  "{{ 'lesser than 23' in hour_output }}"
  block:

    - name: Reassign + greater than 23 => reassign to syed and send email
      ansible.builtin.debug:
        msg: "reassign to syed and send email."
      when: uptime_result == 'Reassign' and hour_greater

    - name: Close + greater than 23 => close ticket
      ansible.builtin.debug:
        msg: "close ticket and end_play"
      when: uptime_result == 'Close' and hour_greater

    - name: Close + lesser than 23 => update notes and end play
      ansible.builtin.debug:
        msg: "update notes and end_playbook"
      when: uptime_result == 'Close' and hour_lesser


    - name: Reassign + lesser than 23 => update next troubleshoot after 1 hr and end play
      ansible.builtin.debug:
        msg: "update next troubleshoot after 1 hr and end_playbook"
      when: uptime_result == 'Reassign' and hour_lesser



  rescue:
    - ansible.builtin.debug:
        msg: "No matching condition found or unexpected output format."
