- debug: var=temp_text
- debug: 
    msg: "{{ temp_text | to_nice_json }}"

- set_fact:
    temp_text_replaced: "{{ temp_text | replace('\\n\\n', '\n')}}"

- debug: var=temp_text_replaced

- name: Extract hostname
  set_fact:
    hostname: "{{ incident_hostname }}"

- name: Extract uptime corresponding to the hostname
  set_fact:
    uptime: >-
      {{
        (temp_text_replaced
        | regex_search(hostname ~ '\\s+up\\s+([^\\r\\n]+)', '\\1')
        | default('')
      }}

- name: Display uptime
  debug:
    msg: "{{ uptime }}"



