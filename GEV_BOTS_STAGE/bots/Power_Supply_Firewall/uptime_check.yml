- set_fact:
     temp_text: "{{ uptime_status_register.Output }}"
- debug: var=temp_text

- name: Extract hostname
  set_fact:
    hostname: "{{ incident_hostname }}"

- name: Extract uptime corresponding to the hostname
  set_fact:
    uptime: >-
      {{
        (temp_text
        | regex_search('(?m)^' ~ (hostname | regex_escape) ~ '\\s+up\\s+(.+)$', '\\1'))
        | first
        | default('')
      }}

- name: Display uptime
  debug:
    msg: "{{ uptime }}"



