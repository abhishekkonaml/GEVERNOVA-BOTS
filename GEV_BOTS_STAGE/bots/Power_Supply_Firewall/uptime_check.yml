- name: Pick first match (if exists)
  set_fact:
    asa_uptime_match: "{{ uptime_matches[0] if uptime_matches|length > 0 else {} }}"

- name: Compute uptime total minutes and print category
  set_fact:
    uptime_days: "{{ (asa_uptime_match.days | default('0')) | int }}"
    uptime_hours: "{{ (asa_uptime_match.hours | default('0')) | int }}"
    uptime_minutes: "{{ (asa_uptime_match.minutes | default('0')) | int }}"
    uptime_seconds: "{{ (asa_uptime_match.seconds | default('0')) | int }}"
    uptime_total_minutes: >-
      {{
        (uptime_days * 24 * 60)
        + (uptime_hours * 60)
        + uptime_minutes
        + (uptime_seconds / 60)
      }}

- name: Categorize uptime vs 30 minutes
  block:
    - name: Uptime > 30 minutes
      debug:
        msg: >-
          uptime greater than 30 minutes ({{ uptime_total_minutes | round(2) }} minutes)
  when: uptime_total_minutes > 30

- name: Uptime <= 30 minutes 
  block:
    - name: Uptime <= 30 minutes
      debug:
        msg: >-
          uptime less than or equal to 30 minutes ({{ uptime_total_minutes | round(2) }} minutes)
  when: uptime_total_minutes <= 30