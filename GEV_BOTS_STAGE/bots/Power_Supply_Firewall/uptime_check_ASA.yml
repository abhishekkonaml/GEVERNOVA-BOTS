- set_fact:
     temp_text: "{{ uptime_status_register.Output }}"
- debug: var=temp_text

- name: Extract hostname
  set_fact:
    hostname: "{{ incident_hostname }}"

# - name: normalise temp_text
#   set_fact:
#      temp_text_clean: >-
#        {{ temp_text | replace('\\r\\n', '\n') | replace('\\n', '\n') | replace('\\r','\n')}}
- name: Extract uptime corresponding to the hostname
  set_fact:
    uptime: >-
      {{
        temp_text
        | regex_search(hostname ~ '\s+up\s+([^\r\n\\\\]+)', '\1' )
        | default([], true)
        | first
        |default('', true)
    
      }}
  ignore_errors: yes

- name: Display uptime
  debug: var=uptime
  ignore_errors: yes

- name: extract exact date time
  set_fact:
    days: "{{ (uptime | regex_search('(\\d+)\\s+day', '\\1') | default(['0'], true) | first) | int }}"
    hours: "{{ (uptime | regex_search('(\\d+)\\s+hour', '\\1') | default(['0'], true) | first) | int }}"
    minutes: "{{ (uptime | regex_search('(\\d+)\\s+minute', '\\1') | default(['0'], true) | first) | int }}"
    seconds: "{{ (uptime | regex_search('(\\d+)\\s+second', '\\1') | default(['0'], true) | first) | int }}"
  when: uptime != ""
  ignore_errors: yes

- name: calculate total time in seconds
  set_fact:
    uptime_seconds: >-
      {{
        ((days| default(0) | int) * 86400) +
        ((hours |default(0)| int) * 3600) +
        ((minutes | default(0) | int) * 60) +
        (seconds |default(0) int)
      }}
  when: uptime != ""
  ignore_errors: yes

- block:
    - debug:
       msg: "Unable to fetch uptime"
    - meta: end_play
    
  when: 
    - uptime is not defined or uptime == ""


- block: 
   - debug:
       msg: "Close Ticket"
   - meta: end_play
  
  when: (uptime_seconds| default(0) | int) >= 7200

- block: 
    - debug:
       msg: "Close Ticket"
    - meta: end_play
  when: (uptime_seconds | default(0) |int) < 7200
