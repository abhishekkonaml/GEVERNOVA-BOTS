---
 - debug: 
     msg: "Running test Temperatire sensor Bot"
 - debug: var={{ fetched_details.description}}
 - action: update_notes incident='{{ incident_no }}' work_notes='[code]<h3> You can expect the next update within 30 minutes.</h3>[/code]'
   register: update_notes



 - name: check connectivity
   action: CommandExecution hostname='{{ incident_hostname }}' command='show sysenv temp' incidentno='{{ incident_no }}' notesupdate='yes' 
   register: temp_status_register
   ignore_errors: true

 - debug: var=temp_status_register
 - name: Set temp_lines from command output
   ansible.builtin.set_fact:
    temp_lines: "{{ temp_status_register.Output | default('') }}"

 - debug: var=temp_lines                
 - name: Parse temperatures into dict (safe - no "first item sequence empty")
   vars:
     temp_threshold: "{{ temp_threshold | default(75.0) }}"


   ansible.builtin.set_fact:
    system_temp_1: >-
      {{
        (
          temp_lines
          | regex_search('(?im)system\\s*temp\\s*1.*?(?:\\b([0-9]+(?:\\.[0-9]+)?)\\b)')
          | default('', true)
          | regex_search('([0-9]+(?:\\.[0-9]+)?)\\b')
          | default('0', true)
        ) | float
      }}
    system_temp_2: >-
      {{
        (
          temp_lines
          | regex_search('(?im)system\\s*temp\\s*2.*?(?:\\b([0-9]+(?:\\.[0-9]+)?)\\b)')
          | default('', true)
          | regex_search('([0-9]+(?:\\.[0-9]+)?)\\b')
          | default('0', true)
        ) | float
      }}
    cpu_temp: >-
      {{
        (
          temp_lines
          | regex_search('(?im)cpu\\s*temp.*?(?:\\b([0-9]+(?:\\.[0-9]+)?)\\b)')
          | default('', true)
          | regex_search('([0-9]+(?:\\.[0-9]+)?)\\b')
          | default('0', true)
        ) | float
      }}
 - name: Fail if any sensor value could not be parsed
   ansible.builtin.fail:
     msg: "Failed to parse one or more sensor temps from output."
   when: >
     (system_temp_1 == 0 and (temp_lines is search('(?i)system\\s*temp\\s*1'))) or
     (system_temp_2 == 0 and (temp_lines is search('(?i)system\\s*temp\\s*2'))) or
     (cpu_temp == 0 and (temp_lines is search('(?i)cpu\\s*temp')))
 - name: Debug OK (optional)
   ansible.builtin.debug:
     msg: >-
       Temperatures parsed:
       system temp 1={{ system_temp_1 }},
       system temp 2={{ system_temp_2 }},
       cpu temp={{ cpu_temp }}
   when: >
     system_temp_1 < temp_threshold and
     system_temp_2 < temp_threshold and
     cpu_temp < temp_threshold