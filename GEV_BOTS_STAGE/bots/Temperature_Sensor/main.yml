---
 - debug: 
     msg: "Running test Temperatire sensor Bot"
 - debug: var={{ fetched_details.description}}
 - action: update_notes incident='{{ incident_no }}' work_notes='[code]<h3> You can expect the next update within 30 minutes.</h3>[/code]'
   register: update_notes


#  - set_fact:
#      incident_hostname: "CSSfdMUSalpdc01a"
 - name: check connectivity
   action: CommandExecution hostname='{{ incident_hostname }}' command='show sysenv temp' incidentno='{{ incident_no }}' notesupdate='yes' 
   register: temp_status_register
   ignore_errors: true

 - debug: var=temp_status_register
 - set_fact:
     temp_text: "{{ temp_status_register.Output }}"


#  - name: Set temp_text from command output (source of truth)
#    ansible.builtin.set_fact:
#         temp_text: "dl: @ge vernova dt cto network firewall supportreport problems @gevernovadtctonetworkfirewallsupport@ge.com name:domain: gdn.ge.comlocation code:as-chn-ln-syg-110161-2xingu  ==================================================================================================:tacp-0 term len 0clinfr0329  invalid command:'term len 0'.:tacp-0 hardware informationname                          value       unit            type          status    maximum     minimum     system temp 1                  39.00        celsius         temperature    0         75.0         0           system temp 2                  40.50        celsius         temperature    0         75.0         0           cpu temp                       29.00        celsius         temperature    0         77.0         0           :tacp-0 "
 - debug: 
    var: temp_text
    verbosity: 0
 - name: test
   ansible.builtin.set_fact:
    system_temp_1_str: "{{ temp_text | regex_search('System\\s+Temp\\s+1\\s+([0-9]+\\.[0-9]+)', '\\1', ignorecase=True) | first }}"   
 - name: test
   ansible.builtin.set_fact:
    system_temp_2_str: "{{ temp_text | regex_search('System\\s+Temp\\s+2\\s+([0-9]+\\.[0-9]+)', '\\1', ignorecase=True) | first }}" 
 - name: test
   ansible.builtin.set_fact:
    CPU_temp_str:  "{{ temp_text | regex_search('CPU\\s+Temp\\s+([0-9]+\\.[0-9]+)', '\\1', ignorecase=True) | first }}"

 - debug: var=system_temp_1_str
 - debug: var=system_temp_2_str
 - debug: var=CPU_temp_str


 - name: Check whether all temperatures were fetched
   ansible.builtin.set_fact:
    temp_fetch_success: >-
      {{
        (system_temp_1_str | default('') | trim != '') and
        (system_temp_2_str | default('') | trim != '') and
        (CPU_temp_str | default('') | trim != '')
      }}

 - name: Unable to fetch temperature
   debug:
    msg: "Unable to fetch temperature"
   when: not temp_fetch_success

 - name: Raise Ticket
   debug:
    msg: "Raise Ticket"
   when:
    - temp_fetch_success
    - >
      (system_temp_1_str | float) > 70 or (system_temp_2_str | float) > 70 or (CPU_temp_str | float) > 70

 - name: Close Ticket
   debug:
    msg: "Close Ticket"
   when:
    - temp_fetch_success
    - (system_temp_1_str | float) <= 70
    - (system_temp_2_str | float) <= 70
    - (CPU_temp_str | float) <= 70
