---
 - debug: 
     msg: "Running test Temperatire sensor Bot"
 - debug: var={{ fetched_details.description}}
 - action: update_notes incident='{{ incident_no }}' work_notes='[code]<h3> You can expect the next update within 30 minutes.</h3>[/code]'
   register: update_notes


#  - set_fact:
#      incident_hostname: "CSSfdMUSalpdc01a"
 - name: check connectivity
   action: CommandExecution hostname='{{ incident_hostname }}' command='show sysenv temp' incidentno='{{ incident_no }}' notesupdate='yes' 
   register: temp_status_register
   ignore_errors: true
 - name: Set temp_threshold globally for this run
   ansible.builtin.set_fact:
    temp_threshold: "{{ temp_threshold | default(75.0) }}"
 - debug: var=temp_status_register


 - name: Set temp_text from command output (source of truth)
   ansible.builtin.set_fact:
        temp_text: "{{ temp_status_register.Output | default('') }}"

 - name: Extract values next to System Temp 1 / System Temp 2 / CPU Temp
   ansible.builtin.set_fact:
        system_temp_1_str: >-
          {{
            (temp_text
              | regex_search('(?im)^\\s*system\\s*temp\\s*1\\s+([0-9]+(?:\\.[0-9]+)?)\\b', '\\1')
            )
            | default('', true)
          }}
        system_temp_2_str: >-
          {{
            (temp_text
              | regex_search('(?im)^\\s*system\\s*temp\\s*2\\s+([0-9]+(?:\\.[0-9]+)?)\\b', '\\1')
            )
            | default('', true)
          }}
        cpu_temp_str: >-
          {{
            (temp_text
              | regex_search('(?im)^\\s*cpu\\s*temp\\s+([0-9]+(?:\\.[0-9]+)?)\\b', '\\1')
            )
            | default('', true)
          }}
 - name: Mark whether each value was available
   ansible.builtin.set_fact:
        system_temp_1_available: "{{ system_temp_1_str | length > 0 }}"
        system_temp_2_available: "{{ system_temp_2_str | length > 0 }}"
        cpu_temp_available: "{{ cpu_temp_str | length > 0 }}"
 - name: Convert to floats only when available
   ansible.builtin.set_fact:
        system_temp_1: "{{ (system_temp_1_str | float) if system_temp_1_available else omit }}"
        system_temp_2: "{{ (system_temp_2_str | float) if system_temp_2_available else omit }}"
        cpu_temp: "{{ (cpu_temp_str | float) if cpu_temp_available else omit }}"
 - name: Decide output (edge cases)
   ansible.builtin.debug:
        msg: >-
          {%- if temp_text | trim == '' or not (system_temp_1_available and system_temp_2_available and cpu_temp_available) -%}
          Unable to fetch values
          {%- else -%}
          {%- set max_val = [system_temp_1, system_temp_2, cpu_temp] | max -%}
          {%- if max_val < temp_threshold -%}
          Close ticket (all temperatures are below {{ temp_threshold }})
          {%- else -%}
          Reassign (at least one temperature is >= {{ temp_threshold }})
          {%- endif -%}
          {%- endif -%}

 # Optional: fail the task if values are not available
 - name: Fail when unable to fetch values (optional)
   ansible.builtin.fail:
        msg: "Unable to fetch values (one or more sensors missing in output)."
   when: temp_text | trim == '' or not (system_temp_1_available and system_temp_2_available and cpu_temp_available)
   ignore_errors: true
