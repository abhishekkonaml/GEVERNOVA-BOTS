---
 - debug: 
     msg: "Running test Temperatire sensor Bot"
 - debug: var={{ fetched_details.description}}
 - action: update_notes incident='{{ incident_no }}' work_notes='[code]<h3> You can expect the next update within 30 minutes.</h3>[/code]'
   register: update_notes


 - set_fact:
     incident_hostname: "CSSfdMUSalpdc01a"
 - name: check connectivity
   action: CommandExecution hostname='{{ incident_hostname }}' command='show sysenv temp' incidentno='{{ incident_no }}' notesupdate='yes' 
   register: temp_status_register
   ignore_errors: true
 - name: Set temp_threshold globally for this run
   ansible.builtin.set_fact:
    temp_threshold: "{{ temp_threshold | default(75.0) }}"
 - debug: var=temp_status_register
 - name: Set raw output text (source of truth)
   ansible.builtin.set_fact:
    temp_text: "{{ temp_status_register.Output | default('') }}"

 - name: Parse temperatures and print status per sensor
   ansible.builtin.set_fact:
    system_temp_1_val: >-
      {{
        (temp_text
          | regex_search('(?im)^\\s*System\\s*Temp\\s*1\\s+([0-9]+(?:\\.[0-9]+)?)\\b', '\\1')
        ) | default('', true)
      }}
    system_temp_2_val: >-
      {{
        (temp_text
          | regex_search('(?im)^\\s*System\\s*Temp\\s*2\\s+([0-9]+(?:\\.[0-9]+)?)\\b', '\\1')
        ) | default('', true)
      }}
    cpu_temp_val: >-
      {{
        (temp_text
          | regex_search('(?im)^\\s*CPU\\s*Temp\\s+([0-9]+(?:\\.[0-9]+)?)\\b', '\\1')
        ) | default('', true)
      }}

 - name: Report system temp 1
   ansible.builtin.debug:
    msg: >-
      System Temp 1: {{
        (system_temp_1_val | length == 0) | ternary('not available',
          ( (system_temp_1_val | float < temp_threshold) | ternary(
            'less than threshold', '>= threshold'
          ))
        )
      }}

 - name: Report system temp 2
   ansible.builtin.debug:
    msg: >-
      System Temp 2: {{
        (system_temp_2_val | length == 0) | ternary('not available',
          ( (system_temp_2_val | float < temp_threshold) | ternary(
            'less than threshold', '>= threshold'
          ))
        )
      }}

 - name: Report cpu temp
   ansible.builtin.debug:
    msg: >-
      CPU Temp: {{
        (cpu_temp_val | length == 0) | ternary('not available',
          ( (cpu_temp_val | float < temp_threshold) | ternary(
            'less than threshold', '>= threshold'
          ))
        )
      }}

# Optional: fail only if we have values and any are >= threshold
 - name: Fail if any available sensor is >= threshold
   ansible.builtin.fail:
    msg: >-
      Temperature threshold check failed.
      system_temp_1={{ system_temp_1_val | default('NA') }},
      system_temp_2={{ system_temp_2_val | default('NA') }},
      cpu_temp={{ cpu_temp_val | default('NA') }},
      threshold={{ temp_threshold }}
   when: >
    ((system_temp_1_val | length > 0 and (system_temp_1_val | float) >= temp_threshold) or
     (system_temp_2_val | length > 0 and (system_temp_2_val | float) >= temp_threshold) or
     (cpu_temp_val | length > 0 and (cpu_temp_val | float) >= temp_threshold))