 - set_fact:
     incident_hostname: "cssfeECHrumla01.gdn.ge.com"

 - name: Execute command
   action: CommandExecution hostname='{{ incident_hostname }}' command=' show environment temperature' incidentno='{{ incident_no }}' notesupdate='yes' 
   register: temp_status_register
   ignore_errors: true

 - debug: var=temp_status_register
 - set_fact:
     temp_text: "{{ temp_status_register.Output | regex_replace('\\\\r\\\\n','\n') }}"


#  - name: Set temp_text from command output (source of truth)
#    ansible.builtin.set_fact:
#         temp_text: "dl: @ge vernova dt cto network firewall supportreport problems @gevernovadtctonetworkfirewallsupport@ge.com name:domain: gdn.ge.comlocation code:as-chn-ln-syg-110161-2xingu  ==================================================================================================:tacp-0 term len 0clinfr0329  invalid command:'term len 0'.:tacp-0 hardware informationname                          value       unit            type          status    maximum     minimum     system temp 1                  39.00        celsius         temperature    0         75.0         0           system temp 2                  40.50        celsius         temperature    0         75.0         0           cpu temp                       29.00        celsius         temperature    0         77.0         0           :tacp-0 "
 - debug: 
    msg: "{{ temp_text | to_json }}"
 - name: Extract Processor 1 Temperature
   ansible.builtin.set_fact:
    processor_temp_str: >-
      {{
        temp_text |
        regex_search(
          'Processor\\s+1:\\s*([0-9]+(?:\\.[0-9]+)',
          '\\1',
          ignorecase=True
        ) | default('')
      }}
   ignore_errors: yes
 - debug: var=processor_temp_str



 - name: Check whether all temperatures were fetched
   ansible.builtin.set_fact:
    temp_fetch_success: >-
      {{
        processor_temp_str | default('') | trim != ''
      }}
   ignore_errors: yes

 - block: 
    - debug:
       msg: "Unable to fetch temperature"
    - meta: end_play
   when: not temp_fetch_success


 - name: Raise Ticket
   debug:
    msg: "Raise Ticket"
   when:
    - check_number == 4
    - temp_fetch_success
    - (system_temp_1_str | float) > 75

 - name: Close Ticket
   debug:
    msg: "Close Ticket"
   when:
    - check_number == 4
    - temp_fetch_success
    - (system_temp_1_str | float) <= 75

