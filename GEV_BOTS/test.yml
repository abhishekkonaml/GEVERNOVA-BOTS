- name: test
  hosts: localhost
  tasks:
    
    - name: login to device
      action: CommandExecution hostname='POWsaMUSschen9B' command='show log | in 1/0/37' incidentno='GEINC12345' notesupdate='no'
      register: Log_register
    - debug: var=Log_register
    - block:
        - debug:
            msg: "Update DB and reassign ticket"
        #- action: update_notes incident='{{ incident_no }}' work_notes='[code]<h3>Unable to fetch logs, Reassigned</h3>[/code]'
        #  register: update_notes
        - meta: end_play
      when: "('invalid input detected' in Log_register.Output)"
    - shell: echo "{{ Log_register.Output }}" > log.txt
    - shell: cat log.txt | tail -n 10
      register: Log_last_ten_register
    - debug: var=Log_last_ten_register
    #- action: update_notes incident='{{ incident_no }}' work_notes='{{ Log_last_ten_register.stdout_lines }}'
    #  register: update_notes
    - shell: echo "{{ Log_register.Output }}" ? log.txt
    - shell: cat log.txt | tail -n 2
      register: Log_last_register
    - debug: var=Log_last_register.stdout_lines
    - set_fact:
        last_log_value: "{{ Log_last_register.stdout_lines[0] }}"
    - debug: var=last_log_value
    - name: login to device
      action: CommandExecution hostname='POWsaMUSschen9B' command='show clock' incidentno='GEINC12345' notesupdate='no'
      register: clock_register
   
    - debug: var=clock_register.Output
    - set_fact:
         presentTime: "{{ clock_register.Output   }}"
    - name: Normalize and parse timestamps
      set_fact:
        dt1: "{{ presentTime | to_datetime(format='%b %d %H:%M:%S.%f UTC') }}"
        dt2: "{{ last_log_value | to_datetime(format='%H:%M:%S.%f UTC %a %b %d %Y') }}"
    - name: Compute time difference
      set_fact:
        diff_seconds: "{{ (dt2 - dt1).total_seconds() }}"
    - name: Show results
      debug:
        msg:
          - "Difference: {{ diff_seconds }} seconds"
          - "Difference: {{ (diff_seconds / 60) | round(2) }} minutes"
    


