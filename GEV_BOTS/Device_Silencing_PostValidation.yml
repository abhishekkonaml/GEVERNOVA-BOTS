- name: test
  hosts: localhost
  tasks:
    - set_fact:
        #query: "short_descriptionLIKEdevice silencing^start_dateBETWEENjavascript:gs.dateGenerate('2026-03-17','00:00:00')@javascript:gs.endOfToday()^state=-1^assigned_to=6b90abba3350ea1475eb1532cd5c7b17/change_request" 
        query: "state=-1^end_dateRELATIVELT@minute@ahead@15^end_date>=javascript:gs.beginningOfLast15Minutes()^short_descriptionLIKEdevice silencing^ORstd_change_producer_version=502807ba2ba4b214ecd1ff916e91bff8/change_request"
    - name: fetch change tickets for post validation
      action: Fetch_change_tickets query1="{{ query }}"
      register: result
    - debug: var=result.response

    - set_fact:
        numbers: "{{ result.response }}"
    - debug: var=numbers
    - block:
        - debug:
            msg: "Call post validation role"
        - include_tasks: bots/Device silencing/Post_Validation.yml
          loop: "{{ numbers }}"
          loop_control: 
            loop_var: ch_number
          ignore_errors: yes
       
       
      when: "'string indices must be integers' not in numbers"
