---
    - set_fact:
        change_number: "{{ ch_number }}"
    - name: Assign tickets to bot
      action: AssignedtoBot ch_number='{{ change_number }}' work_notes='Assigning change to bot for validation'
      register: assign_result
    - debug: var=assign_result
    - set_fact:
        notes: |
              [code] <h3> PRE VALIDATION: Checking health status of affected CI </h3> [/code]
            
    - name: update notes
      action: update_notes_change change_number='{{ change_number }}' work_notes='{{ notes }}'
      register: notes_result
    - debug: var=notes_result
    - name: fetch affected Ci
      action: Prevalidation Change='{{ change_number }}' 
      register: Affected_CI_reg
      ignore_errors: yes
    - debug: var=Affected_CI_reg.output
    - set_fact:
        CI_list: "{{ Affected_CI_reg.output }}"
      ignore_errors: yes
    - debug: var=CI_list
  
    
    - name: Initialize empty dictionary
      set_fact:
         ci_dict: {}
    - name: ping device
      include_tasks: common_actions/DeviceSilencing_ping.yml
      loop: "{{ CI_list }}"
      loop_control:
        loop_var: CI
      vars:
        affected_device_status: "{{ ci_dict }}"
      
      ignore_errors: yes
    - name: affected device output
      debug: 
        var: ci_dict
      ignore_errors: yes

    - name: convert dictionary to html table
      set_fact:
         html_code: | 
           [code]
           <table border="1" cellpadding="6" cellspacing="0">
           <thead>
           <h3> Pre Validation Summary:</h3>
           <table border="1"> 
           <tr>
                     
                      <th style="text-align:center;background-color:#008080;color:white"> Devices  </th> 
                      <th style="text-align:center;background-color:#008080;color:white"> Status </th>
           </tr>

           </thead>
           <tbody>

              {% for name, status in ci_dict.items() %}
           <tr>
           <td>{{ name }}</td>
           <td>{{ status }}</td>
           </tr>

              {% endfor %}
           </tbody>
           </table>
           [/code]
      ignore_errors: yes

    - name: update notes
      action: update_notes_change change_number='{{ change_number }}' work_notes='{{ html_code }}'
      register: notes_result
      ignore_errors: yes
    - debug: var=notes_result

    - name: change state from scheduled to implement
      action: Change_state change='{{ change_number }}' state='implement'
      register: op
      ignore_errors: yes
    - debug: var=op
    - block:
        - set_fact:
           notes: |
              [code] <h3> Updated change ticket status from scheduled to Implementation. </h3> [/code]
            
        - name: update notes
          action: update_notes_change change_number='{{ change_number }}' work_notes='{{ notes }}'
          register: notes_result
          ignore_errors: yes
        - debug: var=notes_result
      when: "'Failed' not in op.result"
    - block:
        - debug: 
            msg: "No ci to validate"
      when: CI_list | length == 0
    - block:
        - debug: 
            msg: "No ci to validate"
      when: "'error' in CI_list"













      
    
    


