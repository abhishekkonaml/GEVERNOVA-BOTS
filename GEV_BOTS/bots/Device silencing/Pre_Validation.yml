---
    - set_fact:
        change_number: "{{ ch_number }}"
    - set_fact:
        notes: |
              [code] <h3> PRE VALIDATION: Checking health status of affected CI </h3> [/code]
            
    - name: update notes
      action: update_notes_change change_number='{{ change_number }}' work_notes='{{ notes }}'
      register: notes_result
    - debug: var=notes_result
    - name: fetch affected Ci
      action: Prevalidation Change='{{ change_number }}' 
      register: Affected_CI_reg
      ignore_errors: yes
    - debug: var=Affected_CI_reg.output
    - set_fact:
        CI_list: "{{ Affected_CI_reg.output }}"
      ignore_errors: yes
    - debug: var=CI_list
  
    
    - name: Initialize empty dictionary
      set_fact:
         dict: {}
    - name: ping device
      include_tasks: common_actions/DeviceSilencing_ping.yml
      loop: "{{ CI_list }}"
      loop_control:
        loop_var: CI
      vars:
        affected_device_status: "{{ dict }}"
      ignore_errors: yes
    - name: affected device output
      debug: 
        var: affected_device_status
      ignore_errors: yes

    - name: convert dictionary to html table
      set_fact:
         html_code: | 
           [code]
           <table border="1" cellpadding="6" cellspacing="0">
           <thead>
           <tr>
           <th>Device Name</th>
           <th>Status</th>
           </tr>
           </thead>
           <tbody>

              {% for name, status in affected_device_status.items() %}
           <tr>
           <td>{{ name }}</td>
           <td>{{ status }}</td>
           </tr>

              {% endfor %}
           </tbody>
           </table>
           [/code]
      ignore_errors: yes

    - name: update notes
      action: update_notes_change change_number='{{ change_number }}' work_notes='{{ html_code }}'
      register: notes_result
    - debug: var=notes_result
    - name: change state from scheduled to implement
      action: Change_state change='{{ change_number }}' state='implement'
      register: op
      ignore_errors: yes
    - debug: var=op

    - block:
        - debug: 
            msg: "No ci to validate"
      when: CI_list | length == 0
    - block:
        - debug: 
            msg: "No ci to validate"
      when: "'error' in CI_list"













      
    
    


