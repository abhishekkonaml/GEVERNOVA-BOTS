---
 - set_fact:
     command1: 'sh cdp nei {{ incident_interface }} detail | in Device'
     command2: 'sh cdp nei {{ incident_interface }} detail | in Port ID'
 - debug: var=command1
 - debug: var=command2
 # Fetching Destination Device
 - name: Fetching Destination device
   action: InterfaceStatusExecution hostname='{{ incident_hostname }}' command='{{ command1 }}' incidentno='{{ incident_no }}' notesupdate='no'
   register: destination_register
 - set_fact:
     destination_result1: "{{ destination_register.Output }}"
 - set_fact:
     destination_result: "{{ destination_result1.replace('\n','').replace('\r','').strip() }}"
 - debug: var=destination_result
 # Finding Destination Device
 # Stopping when B side validation failed
 - block:
   - debug: msg="Bot Failed to validate the B side as it unable to extract the B side details"
   - action: update_notes incident='{{ incident_no }}' work_notes='[code]<h3>Bot failed to validate the B side as it unable to extract the B side details</h3>[/code]'
     register: update_notes
   - debug: var=update_notes
   - meta: end_play
   when:  "('failed' in destination_register.status)"
 
 - set_fact:
      final_status: ''
 - set_fact:
     final_status: 'Bypass'
   when: "( destination_result == '' ) or ( 'entries displayed : 0' in destination_result )"
 - debug: var=final_status
 - block:
   - set_fact:
      temp: "{{ destination_result.split(':') }}"
   - debug: var=temp
   - set_fact: 
      final_status: "Bypass"
     when: "('wd' in temp[1]) or ('wa' in temp[1]) or ('wg' in temp[1]) or ('wn' in temp[1])"
   when: "(destination_result != '') and ('entries displayed : 0' not in destination_result )"
   
 - block:
   - debug: var=final_status
   
   - debug:
       msg: "Bypassing Bside validation closing the case"
   - set_fact:
       input_notes: |
        [code] <h3> Bypassing the Bside validation since B is an Access Point . </h3>[/code]
   - action: update_notes incident='{{ incident_no }}' work_notes='{{ input_notes }}'
     register: update_notes
   - action: update_notes incident='{{ incident_no }}' work_notes='[code]<h3> All checks passed hence closing the case.</h3>[/code]'
     register: update_notes
   - action: closeincident incident='{{ incident_no }}'
     register: closeregister
   - debug: var=closeregister
   - meta: end_play
   when: "'Bypass' in final_status"
 


 - action: InterfaceStatusExecution hostname='{{ incident_hostname }}' command='{{ command2 }}' notesupdate='no' incidentno='{{ incident_no }}'
   register: dest_interface_register
 - debug: var=dest_interface_register
 - block:
   - debug: msg="Bot Failed to validate the B side as it unable to extract the B side interface details"
   - action: update_notes incident='{{ incident_no }}' work_notes='[code]<h3>Bot failed to validate the B side as it unable to extract the B side interface details</h3>[/code]'
     register: update_notes
   - debug: var=update_notes
   - meta: end_play
   when:  "('failed' in dest_interface_register.status)"
 - set_fact: 
     Dest_interface: "{{ dest_interface_register.Output.split(',')[1].split(':')[1].strip().replace('\\r\\n','') }}"
 - debug: var=Dest_interface
 - set_fact: 
     destination: "{{ destination_result.split(':')[1].strip().replace('\\r\\n','') }}"
 - debug: var=destination
 - set_fact:
      bot_notes: |-
                  
                  [code]
                  
                  <h3> B side Details <h3>
                  <table border="1"> 
                    <tr>
                      <th style="text-align:center;background-color:#008080;color:white"> Destination Hostname  </th> 
                      <td> {{ destination }} </td>
                    </tr>
                    <tr>
                      <th style="text-align:center;background-color:#008080;color:white"> Destination Interface  </th> 
                      <td> {{ Dest_interface }} </td>
                    </tr>

                  </table>
                  [/code]


 - set_fact:
      dest_int_command: "show interface {{ Dest_interface }}"
 - action: InterfaceStatusExecution  hostname="{{ destination }}" command='{{ dest_int_command }}' notesupdate='no' incidentno='{{ incident_no }}'
   register: base_register
 - set_fact:
     base_result: "{{ base_register.Output }}"
     base_result_status: "{{ base_register.status }}"
 - debug: var=base_result
 - block:
   - debug: msg="SSH to Destination Device is failed"
   - action: update_notes incident='{{ incident_no }}' work_notes='[code]<h3>SSH to Destination Device is failed</h3>[/code]'
     register: update_notes
   - debug: var=update_notes

   - meta: end_play

   when: "('failed' in base_result_status)"
 - set_fact:
     DestinationDeviceInterfaceMAC: "{{ base_result | regex_search('[0-9a-fA-F]{4}.[0-9a-f]{4}.[0-9a-f]{4}') }}"
 - debug: var=DestinationDeviceInterfaceMAC
 - set_fact: 
     DestinationDeviceInterfaceMAC1: "{{ DestinationDeviceInterfaceMAC.split('.')[0]+'.'+DestinationDeviceInterfaceMAC.split('.')[1] }}" 
 - debug: var=DestinationDeviceInterfaceMAC1
 - action: update_notes incident='{{ incident_no }}' work_notes='{{ bot_notes }}'
   register: update_notes
 - debug: var=update_notes

 - set_fact:
      des_command: 'sh mac address-table interface {{ incident_interface }} | i {{ DestinationDeviceInterfaceMAC1 }}'
 - action: InterfaceStatusExecution hostname="{{ incident_hostname }}" command='{{ des_command }}' notesupdate='no' incidentno='{{ incident_no }}'
   register: val_mac_status
 - set_fact:
      bot_notes: |-
                  
                  [code] 
                    <h3> {{ des_command }} : </h3> 
                    {{ val_mac_status.Output}}
                  [/code]
 - action: update_notes incident='{{ incident_no }}' work_notes='{{ bot_notes }}'
   register: update_notes
 - debug: var=update_notes
 - name: MAC Address Table Data
   set_fact:
     SourceHasDestMac: "{{ val_mac_status.Output }}"
 - debug: var=SourceHasDestMac
 
 - block:
   - set_fact:
        SourceMACStatus: "Exists"
   - debug: var=SourceMACStatus
   - action: update_notes incident='{{ incident_no }}' work_notes='[code]<h3>B side MAC exists in Source MAC address table hence closing the incident.</h3>[/code]'
     register: update_notes
   - debug: var=update_notes
   - action: closeincident incident='{{ incident_no }}'
     register: closeregister
   - debug: var=closeregister

   
   when: 'DestinationDeviceInterfaceMAC1 in SourceHasDestMac'

 - block:
   - name: Dest MAC Not Exists In Source
     set_fact:
      SourceMACStatus: "Not Exists"
   - action: update_notes incident='{{ incident_no }}' work_notes='[code]<h3>B side MAC not exist in Source MAC address table hence reassigned.</h3>[/code]'
     register: update_notes
   - debug: var=update_notes
   - meta: end_play 

   when: 'DestinationDeviceInterfaceMAC1 not in SourceHasDestMac'


