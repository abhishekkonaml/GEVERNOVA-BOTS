---
 - set_fact:
     command1: 'sh cdp nei {{ incident_interface }} detail | in Device'
     command2: 'sh cdp nei {{ incident_interface }} detail | in Port ID'
 # Fetching Destination Device
 - name: Fetching Destination device
   action: CommandExecution hostname='{{ incident_hostname }}' command='{{ command1 }}' 
   register: destination_register
 - set_fact:
     destination_result: "{{ destination_register.Output }}"
 - debug: var=destination_result
 # Finding Destination Device
 # Stopping when B side validation failed
 - block:
   - debug: msg="Bot Failed to validate the B side"
   - action: update_notes incident='{{ incident_no }}' work_notes='[code]<h3>Bot Failed to validate the B side</h3>[/code]'
     register: update_notes
   - debug: var=update_notes
   - meta: end_play
   when:  ('failed' in destination_register.status)"
 - set_fact:
     final_status: "Bypass"
   when: "( destination_register.Output == '' ) or ( 'entries displayed : 0' in destination_register.Output )
 - block:
   - set_fact:
      temp: "{{ destination_result.split(':') }}"
   - set_fact: 
      final_status: "Bypass"
     when: "('wd' in temp[1]) or ('wa' in temp[1]) or ('wg' in temp[1]) or ('wn' in temp[1])"
   when: "(destination_register.Output != '') or ('entries displayed : 0' not in destination_register.Output)




 - action: CommandExecution hostname='{{ incident_hostname }}' command='{{ command2 }}' 
   register: dest_interface_register
 - set_fact: 
     Dest_interface: "{{ dest_interface_register.Output.split(',')[1].split(':')[1].strip() }}"
 - debug: var=Dest_interface
 - set_fact: 
     destination: "{{ destination_result.split(':')[1].strip() }}"
 - debug: var=destination
 - set_fact:
      dest_int_command: "show interface {{ Dest_interface }}"
 - action: CommandExecution  hostname="{{ destination }}" command='{{ dest_int_command }}'
   register: base_register
 - set_fact:
     base_result: "{{ base_register.Output }}"
     base_result_status: "{{ base_register.status }}"
 - debug: var=base_result
 - block:
   - debug: msg="SSH to Destination Device is failed"
   

   - meta: end_play

   when: "('failed' in base_result_status)"
 - set_fact:
     DestinationDeviceInterfaceMAC: "{{ base_result | regex_search('[0-9a-fA-F]{4}.[0-9a-f]{4}.[0-9a-f]{4}') }}"
 - debug: var=DestinationDeviceInterfaceMAC
 - set_fact: 
     DestinationDeviceInterfaceMAC1: "{{ DestinationDeviceInterfaceMAC.split('.')[0]+'.'+DestinationDeviceInterfaceMAC.split('.')[1] }}" 
 - debug: var=DestinationDeviceInterfaceMAC1
 - set_fact:
      des_command: 'sh mac address-table interface {{ incident_interface }} | i {{ DestinationDeviceInterfaceMAC1 }}'
 - action: CommandExecution hostname="{{ incident_hostname }}" command=des_command
   register: val_mac_status
   
 - name: MAC Address Table Data
   set_fact:
     SourceHasDestMac: "{{ val_mac_status.Output }}"
 - debug: var=SourceHasDestMac
 
 - name: Dest MAC Exists In Source
   set_fact:
     SourceMACStatus: "Exists"
   when: 'DestinationDeviceInterfaceMAC1 in SourceHasDestMac'

 - name: Dest MAC Not Exists In Source
   set_fact:
     SourceMACStatus: "Not Exists"
   when: 'DestinationDeviceInterfaceMAC1 not in SourceHasDestMac'


