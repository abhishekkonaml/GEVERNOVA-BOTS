---
 
 - debug:
      msg: "Running the Connection Down Bot"
 - set_fact:
      bot_notes: |-
                  
                  [code]
                  
                  <h3> A side Details <h3>
                  <table border="1"> 
                    <tr>
                      <th style="text-align:center;background-color:#008080;color:white"> Hostname  </th> 
                      <td> {{ incident_hostname }} </td>
                    </tr>
                    <tr>
                      <th style="text-align:center;background-color:#008080;color:white"> Interface  </th> 
                      <td> {{ incident_interface }} </td>
                    </tr>

                  </table>
                  [/code]
                  
                  
 - action: update_notes incident='{{ incident_no }}' work_notes='[code]<h3>Bot Started working on the ticket... Next update in 30 minutes.</h3>[/code]'
   register: update_notes
 - debug: var=update_notes
 - action: update_notes incident='{{ incident_no }}' work_notes='{{ bot_notes }}'
   register: update_notes
 - debug: var=update_notes
 - name: Step1 - Ping Check for the hostname
   include_tasks: common_actions/pingcheck.yml
   vars: 
     frequency: 3
     delay_time: 1
 - name: Step2 - Interface Status check
   include_tasks: common_actions/interfacestatuscheck.yml
   vars:
     interfacefrequency: 1
     interfacedelay: 1
 - name: Step3 - Bypassing B side Validation
   include_tasks: bots/ConnectionAndInterfaceDown/fetching_destination_details.yml




