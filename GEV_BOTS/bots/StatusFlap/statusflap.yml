---
 
  - debug:
       msg: "Running the StatusFlap Bot"
  - set_fact:
       bot_notes: |-
                  
                  [code]
                  
                  <h3> A side Details <h3>
                  <table border="1"> 
                    <tr>
                      <th style="text-align:center;background-color:#008080;color:white"> Hostname  </th> 
                      <td> {{ incident_hostname }} </td>
                    </tr>
                    <tr>
                      <th style="text-align:center;background-color:#008080;color:white"> Interface  </th> 
                      <td> {{ incident_interface }} </td>
                    </tr>

                  </table>
                  [/code]
                  
                  
  - action: update_notes incident='{{ incident_no }}' work_notes='[code]<h3>Bot started working on the ticket...</h3>[/code]'
    register: update_notes
  - debug: var=update_notes
  #- action: update_notes incident='{{ incident_no }}' work_notes='{{ bot_notes }}'
  #  register: update_notes
  - name: Add work notes - 2
    action: worknotesupdate work_notes='{{ bot_notes }}'
  - debug: var=update_notes
  - set_fact:
      interfaceno: "{{ incident_interface | regex_search('[0-9]{1,2}\/[0-9]{1,2}\/[0-9]{1,2}') }}"

  - debug: var=interfaceno

  

  
  #- name: Step1 - Ping Check for the hostname
  #  include_tasks: common_actions/pingcheck.yml
  #  vars: 
  #   frequency: 3
  #   delay_time: 600
  #- name: Step2 - Interface Status check
  #  include_tasks: common_actions/interfacestatuscheck.yml
  #  vars:
  #   interfacefrequency: 3
  #   interfacedelay: 600
  #- name: Step3 - LogCheck Validation
  #  include_tasks: common_actions/log_check.yml 
  #  vars:
  #    keyword_to_validate: "{{ interfaceno }}"
  #  when: interfaceno is defined
  - debug: var=ap_name
  - name: Fetching WLC Details
    action: fetchwlc hostname='{{ ap_name }}'
    register: ap_results_register
  - debug: var=ap_results_register
  - block:
    - set_fact:
         wlc_name: "{{ ap_results_register.result }}" 
         command1: "show ap config general {{ ap_name }}"
    - debug: var=wlc_name
    - debug: var=command1
    - action: WLCExecution hostname='{{ wlc_name }}' command='{{ command1 }}' incidentno='{{ incident_no }}' notesupdate='yes'
      register: apconnected_register
    - debug: var=apconnected_register
    when: "'success' in ap_results_register.status"
  - debug: var=ap_results_register
  




