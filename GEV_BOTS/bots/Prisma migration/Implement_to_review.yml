---
    - set_fact:
        change_number: "{{ ch_number }}"
    - set_fact:
        notes: |
              [code] <h3> implementation completed. Closing Change tasks </h3> [/code]
    - name: update notes
      action: update_notes_change change_number='{{ change_number }}' work_notes='{{ notes }}'
      register: notes_result
      ignore_errors: yes
    - debug: var=notes_result
    
    - name: change state from scheduled to implement
      action: Change_state change='{{ change_number }}' state='review' assigned_to_implementation=502693361 assigned_to_test=560042855
      register: op
      ignore_errors: yes
    - debug: var=op

