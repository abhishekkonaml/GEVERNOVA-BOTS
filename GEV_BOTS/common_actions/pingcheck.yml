---
 - set_fact:
      #hostname1: "{{ incident_hostname }}.gdn.ge.com"
      hostname1: "EMTwcSIDjakar01.gdn.ge.com"
 - name: Source Ping check 
   shell: ping -c 2 {{ hostname1 }}
   register: ping_result_register
   ignore_errors: true
 - set_fact:
      result: "{{ ping_result_register.stdout }}"
 - action: update_notes incident='{{ incident_no }}' work_notes='{{ result }}'
 - name: wait when ping fails
   when: "'64 bytes' not in result" 
   wait_for:
     timeout: "{{ delay_time }}"





    

