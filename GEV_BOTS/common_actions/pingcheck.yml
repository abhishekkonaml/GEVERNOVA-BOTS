---
 - set_fact:
      hostname1: "{{ incident_hostname }}.gd.ge.com"
 
 - name: Source Ping check 
   shell: ping -c 2 {{ hostname1 }}
   register: ping_result_register
   until: ("64 bytes" in ping_result_register.stdout)
   retries: "{{ frequency }}"
   delay: "{{ delay_time }}"
   ignore_errors: true
 - set_fact: 
    ping_result: "{{ ping_result_register.stdout }}"
 - debug: var=ping_result

 - block:
   - debug:
       msg: "Device is not reachable"
   when: "'64 bytes' not in ping_result" 
 