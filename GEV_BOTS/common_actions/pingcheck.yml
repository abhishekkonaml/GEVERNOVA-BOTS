---
 - set_fact:
      #hostname1: "{{ incident_hostname }}.gdn.ge.com"
      hostname1: "EMTwcSIDjakar01.gdn.ge.com"

 - name: Retry block manually
   vars:
     total_retries: 3
 - block:
   - name: Attempt ping
     shell: ping -c 2 {{ hostname1 }}
     register: ping_result
     ignore_errors: true
   - name: Update notes if failed
     action: update_notes incident='{{ incident_no }}' work_notes='{{ ping_result.stdout }}'
     
     when: "'64 bytes' not in ping_result.stdout"
     debug:
       msg: "Ping failed in attempt {{ item }}"
   - name: Wait before retry
     when: "'64 bytes' not in ping_result.stdout"
     wait_for:
       timeout: "{{ delay_time }}"
   loop: "{{ range(1, total_retries + 1) | list }}"
   loop_control:
     loop_var: item
   when: "'64 bytes' not in ping_result.stdout | default('')"

    

 #- name: Source Ping check 
 #  shell: ping -c 2 {{ hostname1 }}
 #  register: ping_result_register
 #  until: ("64 bytes" in ping_result_register.stdout)
 #  retries: "{{ frequency }}"
 #  delay: "{{ delay_time }}"
 #  ignore_errors: true 
 - set_fact: 
    ping_result_op: |
              [code] <h3> PING RESULTS: </h3> [/code]
              {{ ping_result.stdout }}
 - debug: var=ping_result
 - action: update_notes incident='{{ incident_no }}' work_notes='{{ ping_result_op }}'
   register: update_notes
 #- action: worknotesupdate work_notes='{{ ping_result }}'
   
 - set_fact:
      ping_failure_notes: "{{ hostname1 }} is unreachable after three attempts hence reassigned"
 - block:
   - debug:
       msg: "Device is not reachable"
   - set_fact:
        bot_notes: |
                  [code] 
                    <h3>Summary: </h3> 
                    1. Ping is unsuccessful after three attempts hence reassigned.
                    [/code]
   
   - action: update_notes incident='{{ incident_no }}' work_notes='{{ bot_notes }}'
     register: update_notes
   #- action: worknotesupdate work_notes='{{ bot_notes }}'
   #  register: worknotesupdate
   
   - name: save_output
     set_fact:
        aa_start_save: ''
        botname: '{{bot_name}}'
        retcode: 'MBRETCD002'
        retdesc: 'Test Failure'
        assignment_group: "{{assigngrp|default('')}}"
        assign_to: "{{assignto|default('')}}"
        zz_end_save: ''
   - action: reassignment_ticket incident='{{ incident_no }}' group='{{ assignment_group }}'
     register: reassignment_ticket
   
   - meta: end_play
   when: "'64 bytes' not in ping_result_op" 
 