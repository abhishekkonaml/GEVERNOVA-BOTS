---
 - set_fact:
      hostname1: "{{ incident_hostname }}.gdn.ge.com"
 
 - name: Source Ping check 
   shell: ping -c 2 {{ hostname1 }}
   register: ping_result_register
   until: ("64 bytes" in ping_result_register.stdout)
   retries: "{{ frequency }}"
   delay: "{{ delay_time }}"
   ignore_errors: true
 - set_fact: 
    ping_result: |
              [code] <h3> PING RESULTS: </h3> [/code]
              {{ ping_result_register.stdout }}
 - debug: var=ping_result
 - action: update_notes incident='{{ incident_no }}' work_notes='{{ ping_result }}'
   register: update_notes
 - debug: var=update_notes
 - set_fact:
      ping_failure_notes: "{{ hostname1 }} is unreachable after three attempts hence reassigned"
 - block:
   - debug:
       msg: "Device is not reachable"
   - action: update_notes incident='{{ incident_no }}' work_notes='[code]<h3> {{ ping_failure_notes }} </h3>[/code]'
     register: update_notes
   - debug: var=update_notes
   - meta: end_play
   when: "'64 bytes' not in ping_result" 
 