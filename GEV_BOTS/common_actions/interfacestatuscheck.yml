- set_fact:
     command1: "sh int {{ incident_interface }}"
- name: Interface status check
  action: InterfaceStatusExecution hostname='{{ incident_hostname }}' command='{{ command1 }}' incidentno='{{ incident_no }}' notesupdate='yes'
  register: interface_status_register
  until: ("is up" in interface_status_register.Output)
  ignore_errors: true
  retries: "{{ interfacefrequency}}"
  delay: "{{ interfacedelay }}"

- set_fact:
    Interfaceresult: "{{ interface_status_register.Output }}"
- block:
  - debug:    
      msg: "Interface is down hence reassigned"
  - action: update_notes incident='{{ incident_no }}' work_notes='[code]<h3>Summary: \n </h3>  1. Ping is successful. \n 2.Interface is down after three attempts hence reassigned.[/code]'
    register: update_notes
  - debug: var=update_notes
  - name: save_output
    set_fact:
        aa_start_save: ''
        botname: '{{bot_name}}'
        retcode: 'MBRETCD002'
        retdesc: 'Test Failure'
        assignment_group: "{{assigngrp|default('')}}"
        assign_to: "{{assignto|default('')}}"
        zz_end_save: ''
  - meta: end_play 
  when: "('is up' not in Interfaceresult)"

