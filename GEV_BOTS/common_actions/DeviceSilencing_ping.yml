---
 - set_fact:
     hostname: "{{ CI }}.gdn.ge.com"
 - name: Source Ping check 
   shell: ping -c 2 {{ hostname }}
   register: ping_result1
   ignore_errors: true
 - debug: var=ping_result1
 - set_fact: 
     ping_result: |
              [code] <h3> PING RESULTS: {{ hostname }} </h3> [/code]
              {{ ping_result1.stdout }}
 - block:
   - set_fact:
       ci_dict: "{{ affected_device_status | combine({ hostname: 'Reachable'}) }}"
     ignore_errors: yes
     
   when: "'64 bytes' in ping_result1.stdout"
 - block:
   - set_fact:
       ci_dict: "{{ affected_device_status | combine({ hostname: 'Unreachable'}) }}"
     ignore_errors: yes
   when: "'64 bytes' not in ping_result1.stdout"
     

 

 - debug: var=ping_result
 - name: update notes
   action: update_notes_change change_number='{{ change_number }}' work_notes='{{ ping_result }}'
   register: notes_result
 - debug: var=notes_result
