---
 - set_fact:
     hostname: "{{ CI }}.gdn.ge.com"
 - name: Source Ping check 
   shell: ping -c 2 {{ hostname }}
   register: ping_result1
   ignore_errors: true
 - debug: var=ping_result1
 - set_fact: 
     result: |
              [code] <h3> PING RESULTS: {{ hostname }} </h3> [/code]
              {{ ping_result1.stdout }}

 - debug: var=result
 - name: update notes
   action: update_notes_change change_number='{{ change_number }}' work_notes='{{ result }}'
   register: notes_result
 - debug: var=notes_result